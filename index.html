<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffcd20">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="콘티">
<title>예배 콘티</title>
<style>
:root{--bg:#f6f5f1;--card:#fff;--tx:#1d1d1b;--mut:#76736b;--bd:#dedbd2;--ac:#2f5bd6;
--c1:#ffdcdc;--t1:#b3261e;--c2:#dbe7ff;--t2:#1d3f9e;--c3:#d9f2e0;--t3:#1b6a3a;--c0:#ece9e0;--t0:#4a473f;--c4:#ffe6cf;--t4:#8a4a10;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17171a;--card:#222226;--tx:#efeee9;--mut:#9a978e;--bd:#38383d;--ac:#7d9bff;
--c1:#5c2424;--t1:#ffbdb8;--c2:#243562;--t2:#b9ccff;--c3:#1f4630;--t3:#b4ebc6;--c0:#33332f;--t0:#d8d5cb;--c4:#5a3a1c;--t4:#ffd2a8}}
:root[data-theme="dark"]{--bg:#17171a;--card:#222226;--tx:#efeee9;--mut:#9a978e;--bd:#38383d;--ac:#7d9bff;
--c1:#5c2424;--t1:#ffbdb8;--c2:#243562;--t2:#b9ccff;--c3:#1f4630;--t3:#b4ebc6;--c0:#33332f;--t0:#d8d5cb;--c4:#5a3a1c;--t4:#ffd2a8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;font-size:16px}
.app{max-width:1100px;margin:0 auto;padding:14px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
h1{font-size:20px;margin:0}
button{font:inherit;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;padding:8px 12px}
button.pri{background:var(--ac);color:#fff;border-color:var(--ac)}
button.dng{color:#c62828}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px}
.songs{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.songs button{white-space:nowrap}
.songs .newbtn{position:sticky;left:0;z-index:1;flex-shrink:0}
.songs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input[type=text]{font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;min-width:0}
#title{flex:1 1 200px;font-size:18px;font-weight:600}
.lbl{font-size:13px;color:var(--mut);margin:0 0 8px}
.pal{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:8px 14px;border:2px solid transparent;font-weight:600;user-select:none}
.g0{background:var(--c0);color:var(--t0)}.g1{background:var(--c1);color:var(--t1)}.g2{background:var(--c2);color:var(--t2)}.g3{background:var(--c3);color:var(--t3)}.g4{background:var(--c4);color:var(--t4)}
.pal .chip{cursor:pointer}
.work{min-height:110px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;border:2px dashed var(--bd);border-radius:12px;padding:10px}
.work .chip{cursor:grab;border-radius:12px}
.work .chip.sel{border-color:var(--ac)}
.work .chip small{font-weight:400;opacity:.85}
.chip{flex-wrap:wrap;max-width:100%}
.chip .sub{background:var(--card);border-radius:8px;padding:2px 9px;font-size:.78em;font-weight:600}
.subpanel{display:none;margin-top:12px;padding-top:12px;border-top:1px solid var(--bd)}
.subpanel.show{display:block}
.subpanel .pal .chip{padding:6px 12px;opacity:.55}
.subpanel .pal .chip.on{opacity:1;border-color:currentColor}
.subpanel input{width:100%;margin-top:10px}
.numrow{flex-basis:100%;display:flex;gap:6px;align-items:center;padding:2px 0 4px 8px}
.numrow .chip{padding:6px 18px}
.pal .chip.pend{border-color:currentColor}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
@media (max-width:700px){.grid{grid-template-columns:1fr}}
.list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto}
.item{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg)}
.item.on{border-color:var(--ac)}
.item .tt{flex:1;min-width:0;cursor:pointer}
.item .tt b,.item .tt small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .tt small{color:var(--mut);font-size:12px}
.item button{padding:4px 10px}
.item button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.item .num{font-weight:700;color:var(--mut);min-width:18px}
.empty{color:var(--mut);align-self:center;margin:auto}
.tools{display:none;gap:6px;flex-wrap:wrap;margin-top:10px}
.tools.show{display:flex}
.num{font-size:12px;opacity:.7}
.view .chip{font-size:22px;padding:14px 22px;border-radius:16px}
.view .work{border:none;padding:0;gap:12px}
.msg{font-size:13px;color:var(--mut);align-self:center}
#tabs{display:none}
@media (max-width:700px){
 .app{padding:10px}
 h1{font-size:18px}
 #tabs{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);padding:6px 0 10px}
 #tabs button{flex:1;padding:10px 4px;font-weight:600;font-size:15px}
 #tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
 body[data-tab="arch"] #setCard,body[data-tab="arch"] #editor{display:none}
 body[data-tab="set"] #archCard,body[data-tab="set"] #editor{display:none}
 body[data-tab="edit"] #archCard,body[data-tab="edit"] #setCard{display:none}
 button{min-height:44px}
 .list{max-height:none}
 .item{padding:10px}
 .item button{padding:8px 16px;min-height:42px}
 .pal .chip{padding:11px 16px}
 .numrow .chip{padding:10px 22px}
 .work .chip{padding:10px 14px}
 .subpanel .pal .chip{padding:9px 14px}
 input[type=text]{padding:12px;font-size:16px}
 #saveRow{position:sticky;bottom:0;z-index:5;background:var(--bg);padding:10px 0 6px;margin:0 -2px;border-top:1px solid var(--bd)}
 .view .chip{font-size:20px}
}
</style>
</head>
<body data-tab="arch">
<div class="app">
<header><h1>🎼 예배 콘티</h1><div class="row"><button id="modeBtn">👁 보기 모드</button></div></header>

<div id="tabs"><button data-tab="arch">📚 보관함</button><button data-tab="set">📋 이번 주 <span id="cnt"></span></button><button data-tab="edit">✏️ 편집</button></div>
<div id="main" class="grid">
<div class="card" id="archCard">
<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><b>📚 보관함</b><button id="newSong" class="pri">＋ 새 곡</button></div>
<input type="text" id="q" placeholder="곡 검색" style="width:100%;margin-bottom:8px">
<div class="list" id="arch"></div>
<p class="lbl" style="margin:8px 0 0">＋ 를 누르면 오른쪽 이번 주 콘티에 추가돼요</p>
</div>
<div class="card" id="setCard">
<div class="row" style="justify-content:space-between;align-items:center;margin-bottom:8px"><b>📋 이번 주 콘티</b><div class="row"><button id="setPlay">▶ 전체 보기</button><button id="setClear" class="dng">비우기</button></div></div>
<input type="text" id="setName" placeholder="예배 이름/날짜 (예: 10/12 주일예배)" style="width:100%;margin-bottom:8px">
<div class="list" id="setList"></div>
</div>
</div>
<div id="setView" style="display:none"><div class="row" style="margin-bottom:10px;align-items:center"><button id="backBtn">← 돌아가기</button><b id="setTitle"></b></div><div id="setBody"></div></div>

<div id="editor">
<div class="card">
<div class="row">
<input type="text" id="title" placeholder="1. 곡 제목 입력">

</div>
</div>

<div class="card" id="palCard">
<p class="lbl">2. 버튼을 누르면 아래 작업박스에 추가돼요</p>
<div class="pal" id="pal"></div>
<div class="row" style="margin-top:10px">
<input type="text" id="custom" placeholder="직접 입력 (예: 탬버린)" style="flex:1 1 160px">
<button id="addCustom">+ 추가</button>
</div>
</div>

<div class="card">
<p class="lbl" id="workLbl">작업박스 (끌어서 순서 변경 / 탭하면 선택)</p>
<div class="work" id="work"></div>
<div class="tools" id="tools">
<button data-t="left">← 앞으로</button><button data-t="right">뒤로 →</button>
<button data-t="dup">복제</button><button data-t="del" class="dng">삭제</button>
</div>
<div class="subpanel" id="subPanel"></div>
</div>

<div class="row" id="saveRow">
<button class="pri" id="save">💾 3. 저장</button>
<button id="clear">작업박스 비우기</button>
<button class="dng" id="delSong">곡 삭제</button>
<span class="msg" id="msg"></span>
</div>
</div>
</div>

<script>
var PAL=[["인트로",1],["인터루드",1],["아웃트로",1],
["건반",2],["신디",2],["기타",2],["베이스",2],["드럼",2],["보컬",2],["풀밴드",2],
["벌스",3],["프리코러스",3],["코러스",3],["브릿지",3],["엔딩",3],["리프라이즈",3]];
var GROUP={};PAL.forEach(function(p){GROUP[p[0]]=p[1]});
var KEY="worship-conti-v1",songs=[],cur=null,sel=-1,view=false,dragI=-1;
var $=function(id){return document.getElementById(id)};
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function fixLbl(l){return l==="리프레이즈"?"리프라이즈":l}
function load(){try{var r=localStorage.getItem(KEY);songs=r?JSON.parse(r):[]}catch(e){songs=[]}
 songs.forEach(function(s){(s.blocks||[]).forEach(function(b){b.label=fixLbl(b.label);if(b.subs)b.subs=b.subs.map(fixLbl)})})}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(songs));return true}catch(e){return false}}
function blank(){return{id:uid(),title:"",key:"",blocks:[],updated:0}}
function flash(t){$("msg").textContent=t;setTimeout(function(){$("msg").textContent=""},2000)}

var SKEY="worship-conti-set-v1",setl={name:"",ids:[]},q="",setMode=false,dragS=-1;
function loadSet(){try{var r=localStorage.getItem(SKEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.ids))setl=o}}catch(e){}}
function persistSet(){try{localStorage.setItem(SKEY,JSON.stringify(setl))}catch(e){}}
function byId(id){return songs.find(function(s){return s.id===id})}
function inSet(id){return setl.ids.indexOf(id)>=0}
function prog(s){return (s.blocks||[]).map(function(b){return b.label}).join(" · ")}
function ttl(s){return '<b>'+esc(s.title||"(제목 없음)")+'</b><small>'+esc(prog(s))+'</small>'}
function renderArchive(){
 var ql=q.trim().toLowerCase();
 var h=songs.filter(function(s){return !ql||(s.title||"").toLowerCase().indexOf(ql)>=0}).map(function(s){
  var on=inSet(s.id);
  return '<div class="item'+(cur&&cur.id===s.id?' on':'')+'"><div class="tt" data-open="'+s.id+'">'+ttl(s)+'</div><button data-tog="'+s.id+'" class="'+(on?'on':'')+'">'+(on?'✓':'＋')+'</button></div>';
 }).join("");
 $("arch").innerHTML=h||'<span class="empty">'+(songs.length?'검색 결과가 없어요':'저장한 곡이 여기에 쌓여요')+'</span>';
}
function renderSet(){
 var h=setl.ids.map(function(id,i){var s=byId(id);if(!s)return"";
  return '<div class="item" draggable="true" data-si="'+i+'"><span class="num">'+(i+1)+'</span><div class="tt" data-open="'+id+'">'+ttl(s)+'</div><button data-a="up" data-i="'+i+'">↑</button><button data-a="down" data-i="'+i+'">↓</button><button data-a="rm" data-i="'+i+'" class="dng">✕</button></div>';
 }).join("");
 $("setList").innerHTML=h||'<span class="empty">왼쪽 보관함에서 곡을 골라 담아보세요</span>';
}
function renderSongs(){renderArchive();renderSet();$("cnt").textContent=setl.ids.length?"("+setl.ids.length+")":""}
function setTab(t){document.body.setAttribute("data-tab",t);document.querySelectorAll("#tabs button").forEach(function(b){b.classList.toggle("on",b.getAttribute("data-tab")===t)})}
function focusEditor(){if(window.matchMedia("(max-width:700px)").matches){setTab("edit");window.scrollTo(0,0)}else $("editor").scrollIntoView({behavior:"smooth",block:"start"})}
$("tabs").onclick=function(e){var b=e.target.closest("button");if(b){setTab(b.getAttribute("data-tab"));window.scrollTo(0,0)}};
function openSong(id){var x=byId(id);if(!x)return;sel=-1;cur=JSON.parse(JSON.stringify(x));renderAll();focusEditor()}
function chipRO(b,i){return chip(b,i).replace('draggable="true"','draggable="false"')}
function setSetMode(on){
 setMode=on;$("main").style.display=on?"none":"";$("editor").style.display=on?"none":"";
 $("setView").style.display=on?"block":"none";$("modeBtn").style.display=on?"none":"";$("tabs").style.display=on?"none":"";
 document.body.classList.toggle("view",on||view);
 if(on){
  $("setTitle").textContent=setl.name||"이번 주 콘티";
  $("setBody").innerHTML=setl.ids.map(function(id,i){var x=byId(id);if(!x)return"";
   return '<div class="card"><div style="font-size:20px;font-weight:700;margin-bottom:10px">'+(i+1)+'. '+esc(x.title||"")+'</div><div class="work" style="min-height:0">'+x.blocks.map(chipRO).join("")+'</div></div>';
  }).join("");
  window.scrollTo(0,0);
 }
}
function gOf(l){var k=String(l).replace(/[1-4]$/,"");return GROUP[l]!==undefined?GROUP[l]:(GROUP[k]!==undefined?GROUP[k]:0)}
function chip(b,i){
 var subs=(b.subs||[]).map(function(l){return '<span class="sub g'+gOf(l)+'">'+esc(l)+'</span>'}).join("");
 return '<div class="chip g'+gOf(b.label)+'" draggable="'+(!view)+'" data-i="'+i+'"><span class="num">'+(i+1)+'</span>'+esc(b.label)+subs+(b.note?' <small>'+esc(b.note)+'</small>':'')+'</div>';
}
function renderChips(){
 var w=$("work");
 w.innerHTML=cur.blocks.length?cur.blocks.map(chip).join(""):'<span class="empty">위 버튼을 눌러 곡의 진행을 만들어보세요</span>';
 if(sel>=0&&w.children[sel]&&!view)w.children[sel].classList.add("sel");
}
function renderPanel(){
 var on=sel>=0&&!view;
 $("tools").classList.toggle("show",on);$("subPanel").classList.toggle("show",on);
 if(!on){$("subPanel").innerHTML="";return}
 var b=cur.blocks[sel],subs=b.subs||[];
 $("subPanel").innerHTML='<p class="lbl">"'+esc(b.label)+'" 안에 포함할 항목 (눌러서 켜고 끄기)</p><div class="pal">'+
  PAL.map(function(p){return '<span class="chip g'+p[1]+(subs.indexOf(p[0])>=0?' on':'')+'" data-s="'+p[0]+'">'+(subs.indexOf(p[0])>=0?'✓ ':'')+p[0]+'</span>'}).join("")+
  '</div><input type="text" id="memoIn" placeholder="메모 (선택) 예: x2, 여리게, 리프" value="'+esc(b.note||"")+'">';
}
function renderWork(){renderChips();renderPanel()}
function renderAll(){
 $("title").value=cur.title;
 renderSongs();renderWork();
 document.body.classList.toggle("view",view);
 $("palCard").style.display=view?"none":"";$("saveRow").style.display=view?"none":"";
 $("title").disabled=view;
 $("modeBtn").textContent=view?"✏️ 편집 모드":"👁 보기 모드";
 $("workLbl").textContent=view?"진행 순서":"작업박스 (끌어서 순서 변경 / 탭하면 선택)";
}
function add(label){cur.blocks.push({id:uid(),label:label,note:"",subs:[]});sel=cur.blocks.length-1;renderWork()}

$("pal").innerHTML=PAL.map(function(p){return '<span class="chip g'+p[1]+'" data-l="'+p[0]+'">'+p[0]+'</span>'}).join("");
var NUMS=["벌스","프리코러스","코러스","브릿지"],pending=null;
function closeNum(){
 var r=$("pal").querySelector(".numrow");if(r)r.remove();
 pending=null;$("pal").querySelectorAll(".pend").forEach(function(x){x.classList.remove("pend")});
}
$("pal").onclick=function(e){
 var n=e.target.getAttribute("data-n");
 if(n&&pending){var l0=pending;closeNum();add(l0+n);return}
 var c=e.target.closest("[data-l]");if(!c)return;
 var l=c.getAttribute("data-l");
 if(NUMS.indexOf(l)>=0){
  var was=(pending===l);closeNum();if(was){add(l);return}
  pending=l;c.classList.add("pend");
  var d=document.createElement("div");d.className="numrow";
  d.innerHTML=[1,2,3,4].map(function(i){return '<span class="chip g'+gOf(l)+'" data-n="'+i+'">'+i+'</span>'}).join("");
  c.after(d);
 }else{closeNum();add(l)}
};
$("addCustom").onclick=function(){var v=$("custom").value.trim();if(v){add(v);$("custom").value=""}};
$("custom").onkeydown=function(e){if(e.key==="Enter")$("addCustom").click()};
$("title").oninput=function(){cur.title=this.value};

$("work").onclick=function(e){
 var c=e.target.closest(".chip");if(!c||view)return;
 var i=+c.getAttribute("data-i");sel=(sel===i)?-1:i;renderWork();
};
$("work").ondragstart=function(e){var c=e.target.closest(".chip");if(c){dragI=+c.getAttribute("data-i");try{e.dataTransfer.setData("text","x")}catch(x){}}};
$("work").ondragover=function(e){e.preventDefault()};
$("work").ondrop=function(e){
 e.preventDefault();var c=e.target.closest(".chip");if(dragI<0)return;
 var to=c?+c.getAttribute("data-i"):cur.blocks.length-1;
 var it=cur.blocks.splice(dragI,1)[0];cur.blocks.splice(to,0,it);sel=to;dragI=-1;renderWork();
};
$("tools").onclick=function(e){
 var t=e.target.getAttribute("data-t");if(!t||sel<0)return;var b=cur.blocks;
 if(t==="left"&&sel>0){var x=b[sel];b[sel]=b[sel-1];b[sel-1]=x;sel--}
 else if(t==="right"&&sel<b.length-1){var y=b[sel];b[sel]=b[sel+1];b[sel+1]=y;sel++}
 else if(t==="dup"){b.splice(sel+1,0,{id:uid(),label:b[sel].label,note:b[sel].note,subs:(b[sel].subs||[]).slice()});sel++}
 else if(t==="del"){b.splice(sel,1);sel=-1}

 renderWork();
};
$("subPanel").onclick=function(e){
 var l=e.target.getAttribute("data-s");if(!l||sel<0)return;
 var b=cur.blocks[sel];b.subs=b.subs||[];var i=b.subs.indexOf(l);
 if(i>=0)b.subs.splice(i,1);else b.subs.push(l);
 renderChips();renderPanel();
};
$("subPanel").oninput=function(e){
 if(e.target.id==="memoIn"&&sel>=0){cur.blocks[sel].note=e.target.value;renderChips()}
};
$("clear").onclick=function(){if(cur.blocks.length&&confirm("작업박스를 비울까요?")){cur.blocks=[];sel=-1;renderWork()}};
$("save").onclick=function(){
 if(!cur.title.trim()){flash("곡 제목을 입력해주세요");$("title").focus();return}
 cur.updated=Date.now();
 var i=songs.findIndex(function(s){return s.id===cur.id});
 var copy=JSON.parse(JSON.stringify(cur));
 if(i>=0)songs[i]=copy;else songs.push(copy);
 flash(persist()?"저장됨 ✓":"저장 실패 (브라우저 저장소 사용 불가)");renderSongs();
};
$("delSong").onclick=function(){
 var i=songs.findIndex(function(s){return s.id===cur.id});
 if(i<0){cur=blank();sel=-1;renderAll();return}
 if(confirm("'"+(cur.title||"제목 없음")+"' 곡을 삭제할까요?")){var did=cur.id;songs.splice(i,1);persist();setl.ids=setl.ids.filter(function(x){return x!==did});persistSet();cur=songs[0]?JSON.parse(JSON.stringify(songs[0])):blank();sel=-1;renderAll()}
};
$("q").oninput=function(){q=this.value;renderArchive()};
$("newSong").onclick=function(){cur=blank();sel=-1;view=false;renderAll();focusEditor()};
$("arch").onclick=function(e){
 var t=e.target.getAttribute("data-tog");
 if(t){var i=setl.ids.indexOf(t);if(i>=0)setl.ids.splice(i,1);else setl.ids.push(t);persistSet();renderSongs();return}
 var o=e.target.closest("[data-open]");if(o)openSong(o.getAttribute("data-open"));
};
$("setList").onclick=function(e){
 var a=e.target.getAttribute("data-a"),i=+e.target.getAttribute("data-i"),L=setl.ids;
 if(a){
  if(a==="up"&&i>0){var x=L[i];L[i]=L[i-1];L[i-1]=x}
  else if(a==="down"&&i<L.length-1){var y=L[i];L[i]=L[i+1];L[i+1]=y}
  else if(a==="rm")L.splice(i,1);
  persistSet();renderSongs();return;
 }
 var o=e.target.closest("[data-open]");if(o)openSong(o.getAttribute("data-open"));
};
$("setList").ondragstart=function(e){var it=e.target.closest("[data-si]");if(it){dragS=+it.getAttribute("data-si");try{e.dataTransfer.setData("text","x")}catch(x){}}};
$("setList").ondragover=function(e){e.preventDefault()};
$("setList").ondrop=function(e){
 e.preventDefault();var it=e.target.closest("[data-si]");if(dragS<0)return;
 var to=it?+it.getAttribute("data-si"):setl.ids.length-1;
 var m=setl.ids.splice(dragS,1)[0];setl.ids.splice(to,0,m);dragS=-1;persistSet();renderSet();
};
$("setName").oninput=function(){setl.name=this.value;persistSet()};
$("setClear").onclick=function(){if(setl.ids.length&&confirm("이번 주 콘티를 비울까요? (보관함의 곡은 그대로 남아요)")){setl.ids=[];persistSet();renderSongs()}};
$("setPlay").onclick=function(){if(!setl.ids.length){alert("이번 주 콘티에 곡을 먼저 담아주세요");return}setSetMode(true)};
$("backBtn").onclick=function(){setSetMode(false)};
$("modeBtn").onclick=function(){view=!view;sel=-1;renderAll()};

setTab("arch");load();loadSet();setl.ids=setl.ids.filter(function(x){return !!byId(x)});$("setName").value=setl.name||"";cur=songs[0]?JSON.parse(JSON.stringify(songs[0])):blank();renderAll();
</script>
<script>
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
 window.addEventListener("load",function(){try{navigator.serviceWorker.register("sw.js")}catch(e){}});
}
</script>
